# The whole app on one server: database, file storage, backend, and the web server.
#
#   cp .env.example .env        # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#
# docker-compose.yml (no suffix) stays the laptop setup: database and storage only, with the
# backend and frontend run by hand.

# Its own project name, so it never shares containers or volumes with the laptop setup.
name: moneytrail-prod

services:
  # No "ports" on the database or the storage: only the other containers can reach them.
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: moneytrail
      POSTGRES_USER: moneytrail
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneytrail"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-moneytrail}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once to create the bucket, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-moneytrail}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb -p local/moneytrail-receipts

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # Containers run on UTC. "Not in the future" has to mean the owner's today, or an entry
      # typed after midnight in India is refused until 5:30 in the morning.
      TZ: Asia/Kolkata
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-moneytrail}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite-preview}

  # The only container the internet can reach.
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH in .env}
    volumes:
      # The HTTPS certificate lives here. Losing it means asking for a new one on every restart,
      # and the certificate authority limits how often that is allowed.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
