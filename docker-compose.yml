services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: moneytrail
      POSTGRES_USER: moneytrail
      POSTGRES_PASSWORD: moneytrail
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneytrail"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: moneytrail
      MINIO_ROOT_PASSWORD: moneytrail123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 moneytrail moneytrail123 &&
      mc mb -p local/moneytrail-receipts &&
      exit 0
      "

volumes:
  postgres-data:
  minio-data:
